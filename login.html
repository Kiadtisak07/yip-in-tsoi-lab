<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - YIP IN TSOI LAB</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="logo.png">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-card fade-up visible">
      <div class="login-logo">
        <img src="logo.png" alt="Y Logo">
      </div>
      <h1 class="login-title">YIP INT SOI LAB</h1>
      <p class="login-subtitle">Sign in to manage chatbot settings</p>
      
      <form class="login-form" action="index.html">
        <div class="login-input-group">
          <input type="email" placeholder="Email address" class="login-input" required>
          <input type="password" placeholder="Password" class="login-input" required>
        </div>
        
        <button type="submit" class="btn-login">
          <svg class="login-lock-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          Sign in
        </button>
      </form>
    </div>
  </div>
</body>
</html>
